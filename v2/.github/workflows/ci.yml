name: NIK checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y shellcheck bats
      - run: python3 tools/audit-project.py --git
      - name: JavaScript syntax
        run: |
          node --check panel/static/app.js
          node --check panel/static/enhancements.js
          node --check panel/static/sw.js
          node tests/test_result_view.js
      - run: bash tests/check.sh
